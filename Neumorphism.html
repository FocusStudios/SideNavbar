 <title>Side Navbar Design - Neumorphism Effect</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

body {
margin:0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

* {
margin:0;
padding:0;
transition:0.4s;
user-select:none;
font-style:normal;
font-weight:weight;
box-sizing:border-box;
font-optical-sizing:auto;
font-family:"Montserrat", sans-serif;}

img {
pointer-events:none;}

.Body.light {
--background:#e9edf0;
--shadow1:#c4c7c9;
--shadow2:#ffffff;
--digital:#A3A3A3;
--reset:rgba(0,0,0,1);
--theme:#A3A3A3;
--text:#CACACA;
--color1:linear-gradient(#67dfb5,#67dfb5);
--color2:linear-gradient(#42dce2,#42dce2);
--color3:linear-gradient(#ea7bd9,#ea7bd9);
--color4:linear-gradient(#516be4,#516be4);}

.Body.dark {
--background:#1B1A47;
--shadow1:#11102E;
--shadow2:#272654;
--digital:#BEFF6B;
--reset:rgba(255,255,255,1);
--theme:rgba(255,255,255,0.4);
--text:rgba(255,255,255,0.4);
--color1:linear-gradient(#3DFFDE,#00D1AE);
--color2:linear-gradient(#2F8AF9,#0574FA);
--color3:linear-gradient(#FF278F,#C953FF);
--color4:linear-gradient(#7373FC,#4D4DEF);}

@font-face {
font-family:'Digital7';
src:url('JS/digital-7.ttf') format('truetype');}

.Body {
position:fixed;
top:0;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
background:var(--background);}

.MockUp {
position:absolute;
width:560px;}

.Container {
position:absolute;
width:330px;
height:650px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.Screen {
position:absolute;
width:220px;
height:600px;
display:flex;
align-items:center;
justify-content:center;
perspective:800px;}

.control-panel {
position:absolute;
width:329px;
height:874px;
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:50px;
overflow:hidden;
pointer-events:none;
background:var(--background);
transform-style:preserve-3d;
transform:scale(0.65) translate(34px,1px) rotateY(17.5deg);}

.control-panel.active {
pointer-events:auto;}

.Section {
position:relative;
width:100%;
display:flex;
align-items:center;
justify-content:center;}

svg {
fill:var(--text);}

.screen svg {
fill:var(--digital);}


/* Power Screen */

.power {
position:absolute;
top:0;
left:0;
width:65px;
height:65px;
display:flex;
align-items:center;
justify-content:center;}

.power button {
position:absolute;
width:35px;
height:35px;
border-radius:50%;
transition:0.3s;
border:none;
cursor:pointer;
pointer-events:auto;
background:var(--background);
box-shadow:5px 5px 10px var(--shadow1),-5px -5px 10px var(--shadow2);}

.power button:active, .Buttons button:active {
transform:scale(0.8);}

.power span {
position:absolute;
bottom:-5px;}


/* Theme Section */

.theme {
position:absolute;
top:15px;
right:15px;
width:75px;
height:35px;
border-radius:17.5px;
border:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:inset 2px 2px 4px var(--shadow1),inset -2px -2px 4px var(--shadow2);}

.theme img {
position:absolute;
left:10px;
width:20px;
height:20px;}

.Body.dark .theme .light, .Body.light .theme .dark {
opacity:0;}

.Body.light .theme .light, .Body.dark .theme .dark {
opacity:1;}

.theme span {
position:absolute;
right:10px;
font-size:0.6rem;
font-weight:500;
color:var(--theme);}


/* Digital Screen */

.Section.A {
position:relative;
width:160px;
margin-top:50px;
flex-direction:column;
gap:10px;}

.screen {
position:relative;
width:160px;
height:160px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:4px 4px 8px var(--shadow1),-4px -4px 8px var(--shadow2);}

.info {
position:absolute;
width:100%;
height:100%;
display:none;
align-items:center;
justify-content:center;}

.control-panel.active .info {
display:flex;}

.digital {
letter-spacing:3px;
color:var(--digital);
font-family:'Digital7',monospace;}

.degree {
font-size:1.5rem;
margin-top:20px;
letter-spacing:3px;
color:var(--digital);
font-family:Helvetica, Sans-serif;}

.time {
position:absolute;
left:10px;
bottom:10px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;}

.time span {
font-weight:600;
font-size:0.8rem;}

.day {
position:absolute;
top:10px;
right:10px;}

.temp {
font-size:3.5rem;}

.Buttons {
position:relative;
height:45px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;}

.Buttons button {
position:relative;
width:45px;
height:45px;
border-radius:10px;
transition:0.3s;
font-weight:800;
font-size:0.55rem;
color:var(--reset);
border:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:4px 4px 8px var(--shadow1),-4px -4px 8px var(--shadow2);}

.Buttons svg {
fill:var(--reset);}


/* Fan Section */

.Section.B {
position:relative;
width:160px;
flex-direction:column;
gap:15px;}

.Swing {
position:relative;
width:100%;
display:flex;
align-items:center;
justify-content:space-between;}

.Toggle {
position:relative;
width:40px;
height:20px;
margin-right:left;
border-radius:10px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
box-shadow:inset 2px -2px 4px var(--shadow1),inset -2px 2px 4px var(--shadow2);}

.background {
position:absolute;
left:0;
width:10px;
height:100%;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
background:var(--shadow1);}

.thumb {
position:absolute;
left:-15px;
width:30px;
height:30px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:-5px 5px 10px var(--shadow1), 5px -5px 10px var(--shadow2);}

.Toggle.active .background {
width:40px;}

.Toggle.active .thumb {
left:25px;}

.text {
position:relative;
margin-right:auto;
display:flex;
align-items:center;
justify-content:center;
gap:10px;}

.text span, .power span, .Buttons button span {
font-size:0.6rem;
font-weight:700;
color:var(--text);}

.speed {
position:relative;
width:140px;
height:140px;
display:flex;
align-items:center;
justify-content:center;}

.speed-button {
position:absolute;
width:100px;
height:100px;
border-radius:50%;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:10px 10px 20px var(--shadow1),-10px -10px 20px var(--shadow2);}

.speed img {
z-index:2;
pointer-events:none;}

.control-panel.reset .toggle {
transform:none;} 

.arrow {
position:absolute;
top:5px;
width:20px;
height:20px;}


/* Modes Section */

.Modes {
position:relative;
margin-top:-30px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
gap:25px;}

.mode {
position:relative;
width:20px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:10px;}

.range {
position:relative;
width:20px;
height:160px;
border-radius:10px;
overflow:hidden;
cursor:grab;
background:var(--background);
box-shadow:inset -2px 2px 4px var(--shadow1),inset 2px -2px 4px var(--shadow2);}

.level {
position:absolute;
bottom:-140px;
width:20px;
height:160px;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
transition:0.3s ease;}

.control-panel.active .range:nth-child(1) .level {
bottom:-100px;}

.control-panel.active .range:nth-child(2) .level {
bottom:-50px;}

.control-panel.active .range:nth-child(3) .level {
bottom:-80px;}

.control-panel.active .range:nth-child(4) .level {
bottom:-100px;}

.icon {
position:relative;
width:20px;
height:20px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;}

.icon {
background:var(--background);
box-shadow:3px 5px 6px var(--shadow1),-3px -3px 6px var(--shadow2);}

.dot {
position:relative;
width:10px;
height:10px;
border-radius:50%;}

.Modes span {
position:relative;
margin-top:-5px;
font-weight:700;
color:var(--text);
font-size:0.5rem;}

@media screen and (max-height:600px) {

.Container {
top:0;}

}

</style>
