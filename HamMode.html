<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Hamburger Menu Design - Dark & Light Mode</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:#A3A3A3;
--color:#ABFF70;}

body {
margin:0;
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(to bottom right,#ABFF70,#49A626);}

* {
margin:0;
padding:0;
transition:0.2s;
user-select:none;
font-weight:650;
font-style:normal;
box-sizing:border-box;
font-family:"Prompt", serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:hidden;
direction:rtl;}

.Body.dark {
--search:rgba(255,255,255,0.05);
--secondary:#fff;
--background:#171A21;
--theme:#ABFF70;
--theme1:rgba(255,255,255,0.1);
--theme2:rgba(255,255,255,0.02);
--color:#ABFF70;
--layer:rgba(124,222,81,0.1);
--shadow:rgba(194,198,223,0.5);
--text:#C2C6DF;}

.Body.light {
--search:rgba(0,0,0,0.03);
--secondary:#171A21;
--background:#fff;
--theme:rgba(61,66,95,0.2);
--theme1:rgba(61,66,95,0.2);
--theme2:rgba(61,66,95,0.02);
--color:#68D51A;
--layer:rgba(124,222,81,0.2);
--shadow:rgba(61,66,95,0.5);}

.slide {
position:absolute;
top:500px;
height:70vh;
width:80vw;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);
box-shadow:4px 4.5px 12px rgba(0,0,0,0.2);}

.slide h1 {
color:var(--shadow);
font-size:1.5rem;}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.frame {
position:absolute;
top:0;
width:100%;
height:100%;
z-index:-1;
overflow-x:hidden;
overflow-y:auto;
display:none;
direction:ltr;
justify-content:center;}

.frame.active {
display:flex;}

.frame::-webkit-scrollbar {
width:10px;}

.frame::-webkit-scrollbar-thumb {
background:var(--background);
border-radius:5px;}

.Body.touch .frame::-webkit-scrollbar {
display:none;}

.Body.mouse .frame::-webkit-scrollbar {
display:flex;}

.Header {
position:fixed;
top:0;
left:0;
width:100%;
height:55px;
pointer-events:none;}

.Ham {
position:absolute;
top:10px;
left:10px;
cursor:pointer;
pointer-events:auto;
fill:var(--background);
filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3));}

.Cross {
position:absolute;
top:10px;
right:10px;
fill:var(--primary);
cursor:pointer;}

.side-navbar {
position:absolute;
top:0;
left:-220px;
width:220px;
height:100%;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
direction:ltr;
transition:all 0.2s, left 0.4s;
border-radius:0 35px 35px 0;
background:var(--background);
box-shadow:3px 0 3px rgba(0,0,0,0.1);}

.side-navbar.active {
left:0;}

.item-list {
position:absolute;
left:10px;
top:40px;
width:calc(100% - 20px);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
list-style:none;}

.item {
position:relative;
width:100%;
height:30px;
display:flex;
align-items:center;
justify-content:center;
border-radius:15px;
transition:0.4s;
cursor:pointer;
pointer-events:auto;}

.item.active {
pointer-events:none;
background:var(--layer);}

.item.N {
overflow:hidden;}

.item .icon {
position:absolute;
left:0;}

.item .icon {
fill:var(--shadow);}

.item .Text {
position:absolute;
left:35px;
color:var(--shadow);
font-size:0.55rem;
white-space:nowrap;}

.item.active .icon {
fill:var(--color);}

.item.active .Text {
color:var(--color);}

footer {
position:absolute;
left:10px;
bottom:90px;
width:calc(100% - 20px);
height:102px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
transition:0.4s;
gap:6px;}

footer .line {
position:absolute;
top:-6px;
left:0;
width:100%;
height:0.5px;
opacity:0.5;
transition:0.4s;
background:var(--shadow);}

.theme {
position:absolute;
bottom:10px;
left:10px;
width:calc(100% - 20px);
height:50px;
transition:0.4s;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border-radius:25px;
background:var(--theme2);
outline:0.5px solid var(--theme1);}

.theme-icon {
position:absolute;
left:10px;
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.theme-icon img {
position:absolute;
display:none;}

.Body.light .Light, .Body.dark .Dark {
display:flex;}

.Body.light .Dark, .Body.dark .Light {
display:none;}

.theme .toggle {
position:absolute;
left:150px;
width:35px;
height:20px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
cursor:pointer;
background:var(--theme);}

.theme .thumb {
position:absolute;
left:2.5px;
width:15px;
height:15px;
border-radius:7.5px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
background:var(--secondary);
box-shadow:-1px 1px 2px rgba(0,0,0,0.3);}

.theme.active .thumb {
left:17.5px;}

.theme span {
position:absolute;
left:45px;
font-size:0.7rem;
color:var(--secondary);}

.logo {
overflow:hidden;
transform:translateY(-20px);}

.logo .wrapper {
position:absolute;
left:40px;
width:100px;
display:flex;}

.logo span {
position:relative;
font-size:0.8rem;
font-weight:600;}

.logo span:nth-child(1) {
color:var(--secondary);}

.logo span:nth-child(2) {
color:var(--color);}

.logo img {
position:absolute;
left:0;}

.search {
transform:translateY(-10px);}

.search svg {
position:absolute;
left:0;
fill:var(--shadow);
pointer-events:none;}

.input::placeholder {
position:absolute;
top:50%;
color:var(--shadow);
font-weight:400;
font-size:0.6rem;
transform:translate(5px,-50%);}

.input:focus::placeholder {
color:transparent;}

.input {
position:absolute;
left:0;
width:100%;
height:100%;
pointer-events:auto;
cursor:pointer;
transition:0.4s;
font-weight:400;
font-size:0.6rem;
border-radius:15px;
padding-left:30px;
border:none;
color:var(--shadow);
background:var(--search);
caret-color:var(--shadow);
outline:1px solid var(--shadow);}

@media screen and (max-height:670px) {

.frame, .side-navbar {
height:670px;}

}

@media screen and (min-height:670px) {

.frame, .side-navbar {
height:100%;}

}

</style>
