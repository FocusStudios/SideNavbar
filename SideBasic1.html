<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Side Navbar Design - Basic 1</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:#8307BD;
--secondary:#A3A3A3;
--Background:white;
--section:#CACACA;
--Hover:rgba(131,7,189,0.1);
--hover:rgba(131,7,189,0.2);
--account:rgba(255,255,255,0.1);
--background:rgba(255,255,255,0.2);}

body {
margin:0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

* {
margin:0;
padding:0;
transition:0.5s;
user-select:none;
font-weight:650;
font-style:normal;
box-sizing:border-box;
font-family:"Prompt", serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100vw;
height:100vh;
direction:rtl;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.slide {
position:absolute;
top:500px;
height:70vh;
width:80vw;
opacity:20%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
color:rgba(0,0,0,0.3);
background-color:var(--Background);
box-shadow:1px 4.5px 12px currentcolor;}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.frame, .account-settings {
position:fixed;
bottom:0;
left:50px;
width:calc(100% - 50px);
height:100%;
z-index:-1;
overflow-x:hidden;
overflow-y:auto;
direction:ltr;
display:none;
justify-content:center;
background:#8307BD;}

.frame.S, .account-settings {
z-index:2;
display:flex;
left:calc(100vw + 50px);
background:var(--primary);}

.account-settings {
background:var(--Background);}

.frame.S.active, .account-settings.active {
left:0;
width:100%;}

.frame.active {
left:50px;
display:flex;}

.frame::-webkit-scrollbar, .account-settings::-webkit-scrollbar {
width:10px;}

.frame::-webkit-scrollbar-thumb {
border-radius:5px;
background:rgba(255, 255, 255,0.3);}

.account-settings::-webkit-scrollbar-thumb {
border-radius:5px;
background:#DAB3EA;}

.Body.touch .frame::-webkit-scrollbar, .Body.touch .account-settings::-webkit-scrollbar {
display:none;}

.Body.mouse .frame::-webkit-scrollbar, .Body.mouse .account-settings::-webkit-scrollbar {
display:flex;}

.Header {
position:fixed;
top:0;
width:100%;
height:55px;}

.back {
position:absolute;
top:10px;
left:10px;
border-radius:9px;
cursor:pointer;
stroke:var(--Background); 
background:rgba(255,255,255,0.2);
box-shadow:1px 3px 6px rgba(0,0,0,0.1);}

.Back {
background:var(--hover);}

.side-navbar {
top:0;
left:0;
width:50px;
direction:ltr;
display:flex;
align-items:center;
justify-content:center;
background:var(--Background);}

.side-navbar.active {
width:220px;}

.item-list {
position:absolute;
left:10px;
top:90px;
width:200px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
list-style:none;
pointer-events:none;}

.item {
position:relative;
width:200px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.item-btn {
position:absolute;
left:0;
top:0;
width:30px;
height:30px;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
pointer-events:auto;}

.item-btn.active {
cursor:default;}

.item.menu .item-btn.active {
cursor:pointer;}

.item-container {
position:absolute;
left:0;
width:calc(100% - 5px);
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.text {
position:absolute;
left:35px;
padding:3px 7px;
border-radius:5px;
display:none;
align-items:center;
justify-content:center;
white-space:nowrap;
font-size:0.5rem;
color:var(--primary);
background:var(--Background);
border:1px solid var(--Hover);
box-shadow:0 4px 6px rgba(0,0,0,0.1);}

.side-navbar.active .item-btn {
width:200px;}

.item-btn.active, .menu-item.active {
background:var(--Hover);}

.item-btn.active .arrow {
transform:rotate(180deg);}

.item .icon, .item .arrow {
position:absolute;
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;}

.item .icon {
left:0;
fill:var(--primary);}

.item .arrow {
left:170px;
fill:var(--primary);}

.item .Text, .menu-item span, .account-settings .fields li section span {
position:absolute;
left:35px;
width:120px;
font-size:0.6rem;
color:var(--primary);}

.item .Text, .menu-item span {
left:35px;
width:120px;}

.menu-item span {
left:10px;
font-size:0.55rem;}

.item.menu.active {
height:174px;}

.menu-container {
position:absolute;
top:30px;
left:-10px;
width:50px;
height:0;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;}

.side-navbar.active .menu-container {
width:220px;}

.item.menu.active .menu-container {
height:144px;}

.menu-content {
position:absolute;
top:6px;
left:0;
width:220px;
height:138px;
display:flex;
align-items:center;
justify-content:start;}

.menu-list {
position:absolute;
top:0;
left:24.5px;
width:14.5px;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
list-style:none;}

.side-navbar.active .menu-list {
width:185.5px;}

.menu-list-item {
position:relative;
width:100%;
height:30px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:1px;}

.menu-item {
position:relative;
width:calc(100% - 11px);
height:100%;
border-radius:7px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;}

.menu-item-container {
position:absolute;
left:0;
width:calc(100% - 5px);
height:30px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.menu-list .line {
position:absolute;
top:0;
left:0;
width:1px;
height:114px;
background:var(--section);}

.arc { 
position:relative;
margin-top:-9px;
stroke:var(--section);}

footer {
position:absolute;
left:10px;
bottom:20px;
width:200px;
height:102px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
pointer-events:none;}

footer .line {
position:absolute;
top:-6px;
left:0;
width:30px;
height:0.5px;
background:var(--section);}

.side-navbar.active footer .line {
width:200px;}

.account {
position:absolute;
top:0;
width:50px;
height:90px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.info-wrapper {
position:absolute;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:var(--Background);
box-shadow:0 3px 5px rgba(0,0,0,0.05);}

.info-container {
position:absolute;
top:30px;
left:7.5px;
width:35px;
height:35px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.account .container {
position:absolute;
left:0;
width:35px;
height:35px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
cursor:pointer;}

.account .container:active {
transform:scale(0.8);}

.account .container img {
position:absolute;
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;}

.side-navbar.active .info-container {
width:200px;}

.account .account-info {
position:absolute;
left:45px;
width:140px;
height:90%;
overflow:hidden;}

.account .account-info h3, .account .account-info span {
position:absolute;
max-width:95%;
color:var(--primary);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;}

.account .account-info h3 {
top:0;
font-size:0.7rem;
font-weight:700;}

.account .account-info span {
bottom:0;
font-size:0.5rem;
font-weight:300;}

.side-navbar.active .account {
width:220px;}

.Arrow {
position:absolute;
top:10px;
left:38px;
height:25px;
width:25px;
cursor:pointer;
border-radius:12.5px;
fill:var(--primary);
background:var(--Background);
box-shadow:0 3px 3px rgba(0,0,0,0.1);}

.side-navbar.active .Arrow {
left:206px;
transform:rotate(180deg);}

.Menu {
position:absolute;
left:0;
top:42px;
width:200px;
height:150px;
z-index:1;
opacity:0;
border-radius:13px;
display:flex;
align-items:center;
justify-content:end;
pointer-events:none;
transition:0.3s ease-out;
background:var(--Background);
box-shadow:-4px 4px 4px rgba(0,0,0,0.05);}

.Menu.active {
top:36px;
opacity:1;
pointer-events:auto;}

.Menu .menu-content {
width:200px;
justify-content:center;}

.Menu .menu-list {
left:14.5px;
width:179.5px;}

.Menu .menu-list-item {
width:100%;}

.Menu .menu-item {
width:calc(100% - 10px);}

.account-settings .content {
position:absolute;
top:0;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .content-container {
position:relative;
width:100%;
height:670px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.account-settings .container {
position:absolute;
width:120px;
height:120px;
top:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .container img {
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;}

.account-settings .camera {
position:absolute;
bottom:-12px;
right:-3px;
width:55px;
height:55px;
border-radius:50%;
transition:0.3s;
cursor:pointer;
pointer-events:auto;
background:#DAB3EA;
fill:var(--Background);
box-shadow:-3px 3px 5px rgba(0,0,0,0.1);}

.camera:active, .account-settings .save:active {
transform:scale(0.8);}

.account-settings .fields {
position:absolute;
top:250px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;}

.account-settings .fields li {
position:relative;
width:100%;
height:60px;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li section {
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li:first-child section:nth-child(1), .account-settings .fields li:last-child section:nth-child(1) {
left:0;
width:calc(50% - 20px);}

.account-settings .fields li:first-child section:nth-child(2), .account-settings .fields li:last-child section:nth-child(2) {
right:0;
width:calc(50% - 20px);}

.account-settings .fields li section input {
position:absolute;
bottom:0;
width:100%;
height:35px;
padding:0 10px;
border-radius:8px;
border:none;
background:none;
pointer-events:auto;
transition:0.3s;
font-size:0.65rem;
color:rgba(0,0,0,0.2);
outline:1.5px solid rgba(0,0,0,0.2);}

.account-settings .fields li section span {
top:0;
left:10px;
color:rgba(0,0,0,0.2);}

.account-settings .fields li section span.active {
color:var(--primary);}

.account-settings .fields li section input:focus {
color:var(--primary);
outline:1.5px solid var(--primary);}

.account-settings .Header {
position:absolute;}

.account-settings .save {
position:absolute;
bottom:30px;
padding:10px 25px;
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
border:none;
cursor:pointer;
font-size:0.8rem;
pointer-events:none;
background:#F1F1F1;
color:var(--secondary);
box-shadow:-2px 2px 5px rgba(0,0,0,0.1);}

.save.active {
pointer-events:auto;
color:var(--primary);
background:var(--Hover);}

.save.active:hover {
color:var(--Background);
background:var(--primary);}

@media screen and (max-width:400px) {

.account-settings .fields {
width:90%;}

}

@media screen and (min-width:400px) {

.account-settings .fields {
width:360px;}

}

@media screen and (max-height:670px) {

.Body {
overflow-y:auto;}

.side-navbar {
position:absolute;
height:670px;}

.account-settings .content {
height:670px;}

}

@media screen and (min-height:670px) {

.Body {
overflow-y:hidden;}

.side-navbar {
position:fixed;
height:100%;}

.account-settings .content {
height:100%;}

}

</style>

<body>

<div class="Body mouse">

<!-- Account Settings -->

<div class="account-settings">

<div class="content">

<header class="Header">
  <svg class="back Back" width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
   <path d="M17.0769 22.5L12 17.5L17.0769 12.5M12.7051 17.5H23" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</header>

<div class="content-container">

<section class="container">

 <img class="profile" src="Media/Camellia.png">

 <svg class="camera" width="55" height="55" viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M24.2041 16.5869C26.3996 16.471 28.6004 16.471 30.7959 16.5869H30.8008C31.371 16.6204 31.9275 16.7886 32.4229 17.0801C32.9164 17.3706 33.3361 17.7769 33.6445 18.2676L34.6641 19.8721L34.7871 20.041C34.9191 20.204 35.0791 20.3478 35.2627 20.4639C35.4463 20.58 35.6493 20.6662 35.8633 20.7188L36.0811 20.7598L36.085 20.7608C36.562 20.8275 37.0383 20.8998 37.5137 20.9776C39.236 21.2593 40.5 22.7643 40.5 24.5362V34.8311C40.5 35.8212 40.0994 36.76 39.4043 37.4434C38.711 38.125 37.7805 38.4989 36.8203 38.4991H18.1797C17.2194 38.499 16.289 38.125 15.5957 37.4434C14.9006 36.76 14.5 35.8212 14.5 34.8311V24.5362C14.5 22.7647 15.7623 21.2592 17.4863 20.9776C17.9619 20.8995 18.4365 20.8277 18.915 20.7608L18.9199 20.7598C19.2139 20.7203 19.4934 20.6187 19.7383 20.4639C19.9832 20.3091 20.1866 20.106 20.3369 19.8721L21.3545 18.2686C21.663 17.7774 22.0832 17.3708 22.5771 17.0801C23.0725 16.7886 23.6289 16.6204 24.1992 16.5869H24.2041ZM27.5 22.1201C26.1279 22.1202 24.812 22.6872 23.8418 23.6963C22.8715 24.7055 22.3262 26.0739 22.3262 27.501C22.3262 28.9282 22.8715 30.2965 23.8418 31.3057C24.812 32.3148 26.1278 32.8818 27.5 32.8819C28.8723 32.8819 30.1888 32.3148 31.1592 31.3057C32.1292 30.2966 32.6738 28.928 32.6738 27.501C32.6738 26.0741 32.1293 24.7054 31.1592 23.6963C30.1888 22.6872 28.8723 22.1201 27.5 22.1201Z"/>
 </svg>

</section>

<!-- Fields -->

<ul class="fields">

<li>

<section></section>

<section></section>

</li>

<li><section></section></li>

<li><section></section></li>

<li>

<section></section>

<section></section>

</li>

</ul>

<button class="save">Save</button>

</div>

</div>

</div>


<!-- SideNavbar -->

<div class="side-navbar">

<ul class="item-list"></ul>

<footer>

<div class="line"></div>

</footer>

<section class="account">

 <div class="info-wrapper">

  <div class="info-container">

   <section class="container">
    <img class="profile" src="">
   </section>

   <section class="account-info">
    <h3></h3>
    <span></span>
   </section>

  </div>

 </div>

</section>

<svg class="Arrow" width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M11.8984 8.50003C12.1023 8.4984 12.3006 8.56474 12.4609 8.68851L12.5273 8.74515L12.5312 8.74905L15.7324 11.8662C15.9022 12.0314 15.999 12.2578 15.999 12.4951C15.999 12.7325 15.9019 12.9579 15.7324 13.1231L12.5312 16.2412C12.362 16.4059 12.134 16.4971 11.8984 16.4971C11.6632 16.497 11.4358 16.4058 11.2666 16.2412C11.097 16.076 11 15.8497 11 15.6123C11.0001 15.3751 11.097 15.1496 11.2666 14.9844L13.8213 12.4942L11.2666 10.0059L11.2617 10.002C11.0969 9.83586 11.0047 9.61081 11.0068 9.37601C11.009 9.14148 11.1053 8.91895 11.2725 8.75589H11.2734C11.4408 8.59299 11.6654 8.502 11.8984 8.50003Z"/>
</svg>

</div>

</div>

<input type="file" id="CameraInput" accept="image/*" style="display:none;"/>

</html>
