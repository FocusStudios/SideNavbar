<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<title>Smart Home App Design</title>

<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:linear-gradient(#f70f8b,#fc08b7);
--shadow:#fc08b7;
--border:rgba(255,255,255,0.5);
--background:#271b49;}

body {
margin:0;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:var(--background);}

* {
margin:0;
padding:0;
box-sizing:border-box;
transition:0.4s;
user-select:none;
font-style:normal;
font-weight:weight;
font-optical-sizing:auto;
font-family:"Montserrat",sans-serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;}

.side-navbar {
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

/* Section Container*/

.section-container {
position:fixed;
top:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:auto;
opacity:0;
pointer-events:none;
transition:0.3s;}

.section-container.active {
opacity:1;
pointer-events:auto;}

.logo {
position:absolute;
left:15px;
top:15px;
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
transform:translate(calc(50vw - 40px),calc(50vh - 80px)) scale(4);}

.logo .part1 {
stroke-dashoffset:95;
stroke-dasharray:95;}

.logo .part2, .logo .part3, .logo .part4 {
opacity:0;
transform:translateY(20px);}

.logo {
animation:Position 0.6s forwards 4.5s;}

.part1 {
animation: Part1 1.5s ease-in forwards 1s;}

.part2 {
animation: Part2 0.3s cubic-bezier(0,0,0.5,1.5) forwards 2s;}

.part3 {
animation: Part2 0.3s cubic-bezier(0,0,0.5,1.5) forwards 2.5s;}

.part4 {
animation: Part2 0.3s cubic-bezier(0,0,0.5,1.5) forwards 3s;}

@keyframes Part1 {
to{stroke-dashoffset:0;}}

@keyframes Part2 {
to{opacity:1;transform:translateY(0);}}

@keyframes Opacity {
to{opacity:1;}}

@keyframes Position {
to{transform:translate(0,0) scale(1) ;}}

.logo span {
position:absolute;
bottom:-10px;
font-size:0.5rem;
font-weight:700;
opacity:0;
color:transparent;
background:var(--primary);
-webkit-background-clip:text;
background-clip:text;
text-shadow:0 1px 5px rgba(247,15,139,0.5);
animation:Opacity 0.5s forwards 3.6s;}

.section-list {
position:absolute;
top:150px;
left:10px;
width:250px;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:30px;
list-style:none;
padding-bottom:50px;}

.section-list.active {
display:flex;}

.Section {
position:relative;
width:100%;
height:50px;
opacity:0;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
transform:translateY(30px);}

.Section .icon1, .Section .icon2 {
position:absolute;
left:0;
width:50px;
height:50px;
transition:0.3s;}

.Section .icon2 {
opacity:0;}

.Section.active .icon1 {
opacity:0;}

.Section.active .icon2 {
opacity:1;}

.Section span {
position:absolute;
left:60px;
font-size:0.8rem;
transition:0.3s;
color:rgba(255,255,255,0.5);}

.Section.active span {
color:transparent;
background:var(--primary);
-webkit-background-clip:text;
background-clip:text;
text-shadow:0 1px 5px rgba(247,15,139,0.5);}


/* Item Container*/

.item-container {
position:fixed;
top:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:auto;
opacity:0;
pointer-events:none;
transition:0.3s;}

.item-container.active {
opacity:1;
pointer-events:auto;}

.item-container .slide {
position:absolute;
width:80%;
height:70%;
display:flex;
align-items:center;
justify-content:center;
opacity:0;
transform:translateY(30px);
pointer-events:none;
transition:0.5s;
color:var(--border);
border-radius:20px;
background:rgba(255,255,255,0.01);
border:1px solid rgba(255,255,255,0.05);
box-shadow:0px 5px 7px rgba(237,96,164,0.05);
text-shadow:0px 5px 7px rgba(237,96,164,0.05);}

.item-container .slide.active {
opacity:1;
transform:translateY(0);}

.item-list {
position:absolute;
top:80px;
padding-bottom:80px;
--gap:calc(20px*var(--i));
width:calc(100% - 2*var(--gap));
display:none;
align-items:center;
justify-content:center;
gap:var(--gap);}

.item-list.active {
display:grid;}

.item {
position:relative;
width:calc(150px*var(--i));
height:calc(150px*var(--i));
opacity:0;
transform:translateY(100px);
display:flex;
align-items:center;
justify-content:center;}

.item .content {
position:absolute;
flex-shrink:0;
width:100%;
height:100%;
cursor:pointer;
pointer-events:auto;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.01);
border-radius:calc(20px*var(--i));
outline:calc(1px + 3px*(100vw - 360px)/1200px) solid rgba(255,255,255,0.05);
box-shadow:0 calc(5px*var(--i)) calc(8px*var(--i)) rgba(237,96,164,0.05);}

.content .room {
position:absolute;
transition:0.5s;
color:var(--border);
font-size:calc(0.9rem*var(--i));}

.content img {
position:absolute;
width:100%;
height:100%;
opacity:0.4;
object-fit:cover;
border-radius:calc(20px*var(--i));}

svg {
position:absolute;
pointer-events:none;}

.item rect {
position:absolute;
stroke-dashoffset:620;
stroke-dasharray:620;
stroke-linecap:round;
display:none;}

.item.active rect {
display:flex;
animation:Stroke 2s linear forwards;}

@keyframes Show {
to {transform:translateY(0);opacity:1;}}

@keyframes Stroke {
to {stroke-dashoffset:0;}}

.item .Info {
position:absolute;
left:calc(15px*var(--i));
bottom:calc(15px*var(--i));
width:calc(100% - 30px*var(--i));
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;}

.item .Info section {
position:relative;
width:100%;
height:calc(12px*var(--i));
display:flex;
align-items:center;
justify-content:space-between;}

.item .Info span {
position:relative;
color:#A3A3A3;
font-size:calc(0.4rem*var(--i));}

.item.active .room, .item .Info span:last-child, .lamp.active span, .power.active span, .digital, .degree, .OK {
color:transparent;
background:var(--primary);
-webkit-background-clip:text;
background-clip:text;
text-shadow:0 1px 5px var(--shadow);}

.item .Info span:last-child {
font-size:calc(0.5rem*var(--i));}


/* Details */

.details {
position:fixed;
top:0;
width:100%;
height:100%;
opacity:0;
overflow-x:hidden;
overflow-y:auto;
pointer-events:none;
display:none;
align-items:center;
justify-content:center;}

.details.active {
display:flex;
opacity:1;
pointer-events:auto;}

.details-list {
position:absolute;
top:80px;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;
padding:20px 0;
list-style:none;}

.details-list.active {
display:flex;}

.details-list .section {
position:relative;
width:100%;
height:230px;
border-radius:20px;
padding:20px;
opacity:0;
transform:translateY(100px);
display:flex;
align-items:center;
justify-content:space-between;
flex-direction:column;
gap:20px;
background:rgba(255,255,255,0.01);
border:1px solid rgba(255,255,255,0.05);
box-shadow:0px 5px 7px rgba(237,96,164,0.05);}

.section .title {
position:relative;
width:100%;
height:30px;
display:flex;
align-items:center;
justify-content:start;
gap:10px;}

.title img {
position:relative;
width:30px;
height:30px;}

.air-conditioner .title img, .air-conditioner .title span {
margin-left:5px;}

.title span {
position:relative;
font-size:0.7rem;
color:rgba(255,255,255,0.5);}

.section .main-container {
position:relative;
width:100%;
height:calc(100% - 50px);
display:flex;
align-items:center;
justify-content:space-between;}

.air-conditioner .main-container {
align-items:end;}

/* Lighting Section */

.lighting ul {
position:relative;
width:100%;
list-style:none;
display:grid;
align-items:center;
justify-content:center;
grid-template-columns:repeat(2,50px);
column-gap:calc(100% - 180px);
row-gap:30px;}

.details-list:first-child .lighting ul {
grid-template-columns:repeat(3,50px);column-gap:calc((100% - 210px)/2);}

.details-list:nth-child(4) .lighting ul, .details-list:nth-child(6) .lighting ul {
bottom:50px;}

.lamp {
position:relative;
height:50px;
display:flex;
align-items:center;
justify-content:center;}

.lighting .lamp {
width:50px;}

.lamp .stroke {
position:relative;
width:25px;
height:25px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
border-radius:50%;
border:1px solid rgba(255,255,255,0.05);}

.lighting .lamp .stroke {
position:absolute;
top:0;}

.lamp .circle {
position:absolute;
width:25px;
height:25px;
border-radius:50%;
opacity:0;
transition:0.3s;
background:var(--primary);
box-shadow:0 5px 7px rgba(237,96,164,0.05);}

.lamp span {
position:relative;
transition:0.3s;
font-size:0.6rem;
color:var(--border);
white-space:nowrap;
text-shadow:0 5px 7px rgba(237,96,164,0.05);}

.lighting .lamp span {
position:absolute;
bottom:0;}

.lamp.active .circle {
opacity:1;
box-shadow:0 2px 10px rgba(237,96,164,0.5);}

.air-conditioner .container, .fan .container {
position:relative;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:30px;}


/* Power Section */

.power, .swing {
position:relative;
width:60px;
height:60px;
display:flex;
align-items:center;
justify-content:center;
transition:0.5s;}

.air-conditioner .swing, .fan .swing {
height:55px;}

.power span, .swing span, .heat span {
position:absolute;
bottom:0;
font-size:0.6rem;
color:var(--border);}

.power img {
position:absolute;
top:0;
cursor:pointer;
pointer-events:auto;}

.power .on {
opacity:0;}

.power .off {
opacity:1;}

.power.active .on {
opacity:1;}

.power.active .off {
opacity:0;}


/* Swing Section */

.toggle {
position:absolute;
top:10px;
width:30px;
height:15px;
border-radius:7.5px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
cursor:pointer;
background:rgba(255,255,255,0.1);}

.toggle .background {
position:absolute;
left:0px;
width:5px;
height:15px;
border-radius:7.5px;
transition:0.3s;
background:linear-gradient(to right,#f70f8b,#fc08b7);
box-shadow:0 0 10px rgba(237,96,164,0.7);}

.toggle .thumb {
position:absolute;
left:-12.5px;
width:25px;
height:25px;
border-radius:50%;
transition:0.3s;
background:#fff;}

.toggle.active .background {
width:30px;}

.toggle.active .thumb {
left:17.5px;}


/* Temperature Section */

.temperature {
position:relative;
width:120px;
height:150px;
display:flex;
align-items:center;
justify-content:center;}

.temperature .screen {
position:absolute;
top:0;
width:105px;
height:105px;
display:flex;
align-items:center;
justify-content:center;}

.temperature .Buttons {
position:absolute;
bottom:0;
width:120px;
height:45px;
display:flex;
align-items:center;
justify-content:center;}

.temperature .Buttons button {
position:absolute;
width:45px;
height:45px;
background:none;
border-radius:10px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
font-size:1rem;
color:var(--border);
border:1px solid rgba(255,255,255,0.05);}

.minus {
left:0;}

.plus {
right:0;}

.Buttons button:active, .controls button:active, .back:active {
transform:scale(0.8);}

@font-face {
font-family:'Digital7';
src:url('JS/digital-7.ttf') format('truetype');}

.digital {
font-family:'Digital7',monospace;
font-size:4rem;
letter-spacing:3px;
margin-top:5px;}

.degree {
font-family:Helvetica, Sans-serif;
font-size:1.5rem;
letter-spacing:3px;
margin-top:25px;}


/* Heat Section */

.heat {
position:relative;
width:140px;
height:140px;
display:flex;
align-items:center;
justify-content:center;}

.heat img {
position:absolute;}

.control {
position:absolute;
width:80px;
height:80px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,0.05);}

.control .arrow {
position:absolute;
top:0;}


/* Controls Section */

.controls {
position:relative;
width:140px;
height:140px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
border:1px solid rgba(255,255,255,0.05);}

button {
position:absolute;
width:45px;
height:45px;
border:none;
background:none;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;}

.up {
top:0;}

.down {
bottom:0;}

.right {
right:0;}

.left {
left:0;}

.OK {
position:absolute;
width:55px;
height:55px;
font-size:0.8rem;
border-radius:50%;
color:transparent;
border:1px solid rgba(255,255,255,0.05);}


/* Presets Section */

.presets {
position:relative;
display:flex;
align-items:center;
justify-content:start;
flex-direction:column;}

.presets .lamp {
gap:15px;
justify-content:start;
margin-right:auto;}

.back, .Back {
position:absolute;
top:15px;
right:15px;
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:var(--background);
border:1px solid rgba(255,255,255,0.05);}

@media screen and (max-width:700px) {

:root {
--i:100vw/360px;}

.item-list {
grid-template-columns:repeat(2,calc(150px*var(--i)));}

}

@media screen and (min-width:700px) {

:root {
--i:100vw/700px;}

.item-list {
grid-template-columns:repeat(3,calc(150px*var(--i)));}

}

@media screen and (max-width:600px) {

.details-list {
width:calc(100% - 40px);}

}

@media screen and (min-width:600px) {

.details-list {
width:600px;}

}

</style>

<body>

<div class="Body">

<div class="side-navbar">

<div class="section-container active">
