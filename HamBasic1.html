<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Hamburger Menu Design - Basic 1</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:#8307BD;
--secondary:#A3A3A3;
--Background:white;
--section:#CACACA;
--Hover:rgba(131,7,189,0.1);
--hover:rgba(131,7,189,0.2);
--account:rgba(255,255,255,0.1);
--background:rgba(255,255,255,0.2);}

body {
margin:0;
width:100vw;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

* {
margin:0;
padding:0;
transition:0.5s;
user-select:none;
font-weight:650;
font-style:normal;
box-sizing:border-box;
font-family:"Prompt", serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100%;
height:100%;
direction:rtl;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:hidden;
background:var(--primary);}

.slide {
position:absolute;
top:500px;
height:70vh;
width:80vw;
opacity:20%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
color:rgba(0,0,0,0.3);
background-color:var(--Background);
box-shadow:1px 4.5px 12px currentcolor;}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.frame {
position:fixed;
width:100%;
height:100%;
right:0;
z-index:-1;
overflow-x:hidden;
overflow-y:auto;
display:none;
direction:ltr;
justify-content:center;}

.frame.active {
display:flex;}

.S, .account-settings {
position:fixed;
width:100%;
height:100%;
z-index:2;
display:flex;
left:100vw;
overflow-x:hidden;
overflow-y:auto;
direction:ltr;
justify-content:center;
background:var(--primary);}

.account-settings {
background:var(--Background);}

.S.active, .account-settings.active {
left:0;
width:100%;}

.frame::-webkit-scrollbar, .account-settings::-webkit-scrollbar {
width:10px;}

.frame::-webkit-scrollbar-thumb {
border-radius:5px;
background:rgba(255, 255, 255,0.3);}

.account-settings::-webkit-scrollbar-thumb {
border-radius:5px;
background:#DAB3EA;}

.Body.touch .frame::-webkit-scrollbar, .Body.touch .account-settings::-webkit-scrollbar {
display:none;}

.Body.mouse .frame::-webkit-scrollbar, .Body.mouse .account-settings::-webkit-scrollbar {
display:flex;}

.Header {
position:absolute;
top:0;
width:100%;
height:55px;
pointer-events:none;}

.S .Header {
position:sticky;}

.Header.H {
position:fixed;
left:0;}

.Ham {
position:absolute;
top:10px;
left:10px;
cursor:pointer;
pointer-events:auto;
fill:var(--Background);}

.back {
position:absolute;
top:10px;
left:10px;
border-radius:9px;
cursor:pointer;
pointer-events:auto;
stroke:var(--Background); 
background:rgba(255,255,255,0.2);
box-shadow:1px 3px 6px rgba(0,0,0,0.15);}

.Back {
stroke:var(--primary);
background:var(--Hover);}

.Cross {
position:absolute;
top:0;
right:0;
fill:var(--primary);
cursor:pointer;}

.side-navbar {
position:absolute;
top:0;
left:-220px;
width:220px;
direction:ltr;
display:flex;
align-items:center;
justify-content:center;
background:var(--Background);}

.side-navbar.active {
left:0;}

.item-list {
position:absolute;
left:10px;
top:90px;
width:200px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
list-style:none;
pointer-events:none;}

.item {
position:relative;
width:200px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.item-btn {
position:absolute;
left:0;
top:0;
width:200px;
height:30px;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
pointer-events:auto;}

.item-btn.active {
cursor:default;}

.item.menu .item-btn.active {
cursor:pointer;}

.item-btn.active, .menu-item.active {
background:var(--Hover);}

.item-btn.active .arrow {
transform:rotate(180deg);}

.item .icon, .item .arrow {
position:absolute;
width:30px;
height:30px;
display:flex;
align-items:center;
justify-content:center;}

.item .icon {
left:0;
fill:var(--primary);}

.item .arrow {
left:170px;
fill:var(--primary);}

.item .Text, .menu-item span, .account-settings .fields li section span {
position:absolute;
left:35px;
width:120px;
font-size:0.6rem;
color:var(--primary);}

.item .Text, .menu-item span {
left:35px;
width:120px;}

.menu-item span {
left:10px;
font-size:0.55rem;}

.item.menu.active {
height:174px;}

.menu-container {
position:absolute;
top:30px;
left:-10px;
width:220px;
height:0;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;}

.item.menu.active .menu-container {
height:144px;}

.menu-content {
position:absolute;
top:6px;
left:0;
width:220px;
height:138px;
display:flex;
align-items:center;
justify-content:start;}

.menu-list {
position:absolute;
top:0;
left:24.5px;
width:185.5px;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
list-style:none;}

.menu-list-item {
position:relative;
width:100%;
height:30px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
gap:1px;}

.menu-item {
position:relative;
width:calc(100% - 11px);
height:100%;
border-radius:7px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;}

.menu-list .line {
position:absolute;
top:0;
left:0;
width:1px;
height:114px;
background:var(--section);}

.arc { 
position:relative;
margin-top:-9px;
stroke:var(--section);}

footer {
position:absolute;
left:10px;
bottom:20px;
width:200px;
height:102px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:6px;
pointer-events:none;}

footer .line {
position:absolute;
top:-6px;
left:0;
width:30px;
height:0.5px;
background:var(--section);}

.side-navbar.active footer .line {
width:200px;}

.account {
position:absolute;
top:0;
width:220px;
height:90px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.info-wrapper {
position:absolute;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:var(--Background);
box-shadow:0 3px 5px rgba(0,0,0,0.05);}

.info-container {
position:absolute;
top:30px;
left:7.5px;
width:200px;
height:35px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.account .container {
position:absolute;
left:0;
width:35px;
height:35px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
cursor:pointer;}

.account .container:active {
transform:scale(0.8);}

.account .container img {
position:absolute;
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;}

.account .account-info {
position:absolute;
left:45px;
width:140px;
height:90%;
overflow:hidden;}

.account .account-info h3, .account .account-info span {
position:absolute;
max-width:95%;
color:var(--primary);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;}

.account .account-info h3 {
top:0;
font-size:0.7rem;
font-weight:700;}

.account .account-info span {
bottom:0;
font-size:0.5rem;
font-weight:300;}

.account-settings .content {
position:absolute;
top:0;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .content-container {
position:relative;
width:100%;
height:670px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.account-settings .container {
position:absolute;
width:120px;
height:120px;
top:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .container img {
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;}

.account-settings .camera {
position:absolute;
bottom:-12px;
right:-3px;
width:55px;
height:55px;
border-radius:50%;
transition:0.3s;
cursor:pointer;
pointer-events:auto;
background:#DAB3EA;
fill:var(--Background);
box-shadow:-3px 3px 5px rgba(0,0,0,0.1);}

.camera:active, .account-settings .save:active {
transform:scale(0.8);}

.account-settings .fields {
position:absolute;
top:250px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;}

.account-settings .fields li {
position:relative;
width:100%;
height:60px;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li section {
position:absolute;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li:first-child section:nth-child(1), .account-settings .fields li:last-child section:nth-child(1) {
left:0;
width:calc(50% - 20px);}

.account-settings .fields li:first-child section:nth-child(2), .account-settings .fields li:last-child section:nth-child(2) {
right:0;
width:calc(50% - 20px);}

.account-settings .fields li section input {
position:absolute;
bottom:0;
width:100%;
height:35px;
padding:0 10px;
border-radius:8px;
border:none;
background:none;
pointer-events:auto;
transition:0.3s;
font-size:0.65rem;
color:rgba(0,0,0,0.2);
outline:1.5px solid rgba(0,0,0,0.2);}

.account-settings .fields li section span {
top:0;
left:10px;
color:rgba(0,0,0,0.2);}

.account-settings .fields li section span.active {
color:var(--primary);}

.account-settings .fields li section input:focus {
color:var(--primary);
outline:1.5px solid var(--primary);}

.account-settings .Header {
position:absolute;}

.account-settings .save {
position:absolute;
bottom:30px;
padding:10px 25px;
border-radius:50px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
border:none;
cursor:pointer;
font-size:0.8rem;
pointer-events:none;
background:#F1F1F1;
color:var(--secondary);
box-shadow:-2px 2px 5px rgba(0,0,0,0.1);}

.save.active {
pointer-events:auto;
color:var(--primary);
background:var(--Hover);}

.save.active:hover {
color:var(--Background);
background:var(--primary);}

@media screen and (max-width:400px) {

.account-settings .fields {
width:90%;}

}

@media screen and (min-width:400px) {

.account-settings .fields {
width:360px;}

}

@media screen and (max-height:670px) {

.side-navbar {
height:670px;}

.account-settings .content {
height:670px;}

}

@media screen and (min-height:670px) {

.side-navbar {
height:100%;}

.account-settings .content {
height:100%;}

}

</style>

<body>

<header class="Header H">
