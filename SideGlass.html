<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Hamburger Menu Design - Glass Morphism Effect</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:#fff;}

body {
margin:0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

* {
margin:0;
padding:0;
transition:0.4s;
user-select:none;
box-sizing:border-box;
font-optical-sizing:auto;
font-family:"Montserrat", sans-serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100vw;
height:100vh;
direction:rtl;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:auto;
background-size:cover;
background-image:url("Media/Wallpaper.png");}

.slide {
position:absolute;
top:500px;
width:95%;
height:70vh;
display:flex;
justify-content:center;
align-items:center;
border-radius:20px;
background:rgba(255,255,255,0.1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);}

.slide h1 {
color:rgba(255,255,255,0.3);}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.frame {
position:fixed;
width:calc(100% - 70px);
height:100%;
right:0;
z-index:-1;
overflow-x:hidden;
overflow-y:auto;
display:none;
direction:ltr;
justify-content:center;}

.frame.active {
display:flex;}

.account-settings, .Search {
position:fixed;
width:100%;
height:100%;
z-index:3;
display:flex;
left:100vw;
overflow-x:hidden;
overflow-y:auto;
direction:ltr;
justify-content:center;
backdrop-filter:blur(10px);
background:rgba(255,255,255,0.1);}

.account-settings.active, .Search.active {
left:0;
width:100%;}

.frame::-webkit-scrollbar, .account-settings::-webkit-scrollbar {
width:10px;}

.frame::-webkit-scrollbar-thumb, .account-settings::-webkit-scrollbar-thumb {
border-radius:5px;
background:rgba(255,255,255,0.1);}

.Body.touch .frame::-webkit-scrollbar, .Body.touch .account-settings::-webkit-scrollbar {
display:none;}

.Body.mouse .frame::-webkit-scrollbar, .Body.mouse .account-settings::-webkit-scrollbar {
display:flex;}

.Header {
position:fixed;
top:0;
left:0;
width:100%;
height:55px;
z-index:1;
pointer-events:none;}

.account-settings .Header {
position:absolute;}

.back {
position:relative;
border-radius:9px;
stroke:var(--primary);
stroke-width:2;
cursor:pointer;
pointer-events:auto;
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);
background:linear-gradient(to bottom right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.05) 75%);}

.account-settings .back {
position:absolute;
top:10px;
left:10px;}

.side-navbar {
position:absolute;
top:1px;
left:0;
width:70px;
z-index:2;
direction:ltr;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:30px;
border-radius:0 10px 10px 0;
backdrop-filter:blur(10px);
background:rgba(255,255,255,0.1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:2px 0 8px rgba(255,255,255,0.1);}

.item-list {
position:relative;
width:40px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:30px;
list-style:none;
pointer-events:none;}

.item {
position:relative;
width:40px;
height:60px;
display:flex;
align-items:center;
justify-content:center;}

.item .icon {
position:absolute;
top:0;
width:40px;
height:40px;
opacity:0.5;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
cursor:pointer;}

.item.active .icon {
pointer-events:none;}

.item .square {
position:absolute;
top:0;
opacity:0;
pointer-events:none;
filter:drop-shadow(0 5px 5px rgba(0,0,0,0.8));}

.item.active .icon, .item.active .square, .item.active .Text {
opacity:1;}

.icon svg {
fill:var(--primary);}

.item .Text, .account-settings .fields li section span {
position:absolute;
opacity:0.5;
font-size:0.5rem;
color:var(--primary);}

.item .Text {
bottom:0;}

.account-settings .fields li section span {
top:0;
left:5px;}

.account {
position:relative;
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;}

.glass {
position:absolute;
width:100%;
height:100%;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
cursor:pointer;
background:linear-gradient(to bottom right, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 75%);}

.account img, .account-settings img {
position:absolute;
width:95%;
height:95%;
border-radius:50%;
object-fit:cover;}

.account .Active {
position:absolute;
bottom:2px;
right:2px;
width:10px;
height:10px;
border-radius:50%;
background:#4abf02;}

.side-navbar .search {
position:relative;
width:40px;
height:40px;
border-radius:10px;
cursor:pointer;
pointer-events:auto;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.03);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:0 2px 4px rgba(255,255,255,0.1);}

.search svg {
position:absolute;
pointer-events:none;
stroke-width:2;
stroke:rgba(255,255,255,0.5);}

.Search .Header {
display:flex;
align-items:center;
justify-content:center;
gap:10px;}

.Search .search {
position:relative;
width:calc(100% - 65px);
height:35px;
display:flex;
align-items:center;
justify-content:center;}

.Search .search svg {
position:absolute;
left:2.5px;
pointer-events:none;
stroke-width:2;
stroke:rgba(255,255,255,0.5);}

.input::placeholder {
position:absolute;
top:50%;
font-weight:400;
font-size:0.6rem;
transform:translateY(-50%);
color:rgba(255,255,255,0.7);}

.input:focus::placeholder {
color:transparent;}

.input {
position:absolute;
width:100%;
height:100%;
font-weight:400;
font-size:0.6rem;
border:none;
border-radius:10px;
padding-left:35px;
caret-color:#fff;
pointer-events:auto;
background:var(--background);
color:rgba(255,255,255,0.5);
outline:1px solid rgba(255,255,255,0.2);}

.input:focus {
color:rgba(255,255,255,1);
outline:1px solid rgba(255,255,255,0.5);}

.account-settings .content {
position:absolute;
top:0;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .content-container {
position:relative;
width:100%;
height:670px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.account-settings .container {
position:absolute;
top:50px;
width:120px;
height:120px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .container img {
width:97%;
height:97%;}

.account-settings .camera {
position:absolute;
bottom:-12px;
right:-3px;
width:55px;
height:55px;
border-radius:50%;
cursor:pointer;
pointer-events:auto;
fill:#0B1A9B;
transition:0.3s;
background:var(--primary);
box-shadow:-3px 3px 5px rgba(0,0,0,0.1);}

.account:active, .camera:active, .account-settings .save:active {
transform:scale(0.8);}

.account-settings .fields {
position:absolute;
top:250px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;}

.account-settings .fields li {
position:relative;
width:100%;
height:60px;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li section {
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;}

.account-settings .fields li:first-child section:nth-child(1), .account-settings .fields li:last-child section:nth-child(1) {
left:0;
width:calc(50% - 20px);}

.account-settings .fields li:first-child section:nth-child(2), .account-settings .fields li:last-child section:nth-child(2) {
right:0;
width:calc(50% - 20px);}

.account-settings .fields li section input {
position:absolute;
bottom:0;
width:100%;
height:40px;
padding:0 10px;}

.account-settings .fields span.active {
opacity:1;}

.account-settings .save {
position:absolute;
bottom:30px;
padding:12px 25px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
opacity:0;
font-size:0.8rem;
border:none;
cursor:pointer;
pointer-events:none;
color:rgba(255,255,255,1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);
background:linear-gradient(to bottom right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.05) 75%);}

.save.active {
opacity:1;
pointer-events:auto;}

@media screen and (max-width:400px) {

.account-settings .fields {
width:90%;}

}

@media screen and (min-width:400px) {

.account-settings .fields {
width:360px;}

}

@media screen and (max-height:670px) {

.account-settings .content {
height:670px;}

}

@media screen and (min-height:670px) {

.account-settings .content {
height:100%;}

}

@media screen and (max-height:690px) {

.side-navbar {
height:688px;}

.account-settings .content {
height:700px;}

}

@media screen and (min-height:690px) {

.side-navbar {
height:calc(100% - 2px);}

.account-settings .content {
height:100%;}

}

</style>

<body>

  <svg class="back" width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
   <path d="M17.0769 22.5L12 17.5L17.0769 12.5M12.7051 17.5H23" stroke-linecap="round" stroke-linejoin="round"/>

   </svg>

  </div>

 </header>

</div>

  <svg class="back" width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
   <path d="M17.0769 22.5L12 17.5L17.0769 12.5M12.7051 17.5H23" stroke-linecap="round" stroke-linejoin="round"/>

<div class="content-container">

<section></section>

<li><section></section></li>

<li><section></section></li>

<li>

<section></section>

<section></section>

</li>

</ul>

<button class="save">Save</button>

</div>

</div>

</div>


<!-- SideNavbar -->

<div class="side-navbar">

<div class="search">

 <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">

    <img class="profile">
    <div class="Active"></div>
  </div>

</section>

</div>

</div>

<input type="file" id="CameraInput" accept="image/*" style="display:none;"/>

</html>
