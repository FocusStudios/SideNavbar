<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" type="image/x-icon" href="Focus.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<title>Hamburger Menu Design - Glass Morphism Effect</title>
    
<style>

html {
-webkit-tap-highlight-color:transparent;
scroll-behavior:smooth;}

:root {
--primary:#fff;}

body {
margin:0;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

* {
margin:0;
padding:0;
transition:0.4s;
user-select:none;
box-sizing:border-box;
font-optical-sizing:auto;
font-family:"Montserrat", sans-serif;}

img {
pointer-events:none;}

.Body {
position:fixed;
top:0;
width:100vw;
height:100vh;
direction:rtl;
display:flex;
align-items:center;
justify-content:center;
overflow-x:hidden;
overflow-y:hidden;
background-size:cover;
background-image:url("Media/Wallpaper.png");}

.slide {
position:absolute;
top:500px;
width:80vw;
height:70vh;
display:flex;
justify-content:center;
align-items:center;
border-radius:20px;
background:rgba(255,255,255,0.1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);}

.slide h1 {
color:rgba(255,255,255,0.3);}

.content {
position:absolute;
width:100%;
height:2000px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.frame {
position:fixed;
width:100%;
height:100%;
right:0;
z-index:-1;
overflow-x:hidden;
overflow-y:auto;
display:none;
direction:ltr;
justify-content:center;}

.frame.active {
display:flex;}

.account-settings {
position:fixed;
width:100%;
height:100%;
z-index:3;
display:flex;
left:100vw;
overflow-x:hidden;
overflow-y:auto;
direction:ltr;
justify-content:center;
backdrop-filter:blur(10px);
background:rgba(255,255,255,0.1);}

.account-settings.active {
left:0;
width:100%;}

.frame::-webkit-scrollbar, .account-settings::-webkit-scrollbar {
width:10px;}

.frame::-webkit-scrollbar-thumb, .account-settings::-webkit-scrollbar-thumb {
border-radius:5px;
background:rgba(255,255,255,0.1);}

.Body.touch .frame::-webkit-scrollbar, .Body.touch .account-settings::-webkit-scrollbar {
display:none;}

.Body.mouse .frame::-webkit-scrollbar, .Body.mouse .account-settings::-webkit-scrollbar {
display:flex;}

.Header {
position:fixed;
top:0;
left:0;
width:100%;
height:55px;
z-index:1;
pointer-events:none;}

.account-settings .Header {
position:absolute;}

.back {
position:absolute;
top:10px;
left:10px;
border-radius:9px;
stroke:var(--primary);
stroke-width:2;
cursor:pointer;
pointer-events:auto;
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);
background:linear-gradient(to bottom right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.05) 75%);}

.Ham {
position:absolute;
top:10px;
left:10px;
fill:var(--primary);
cursor:pointer;
pointer-events:auto;}

.Cross {
position:absolute;
top:10px;
right:10px;
width:25px;
height:35px;
border-radius:10px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
outline:1px solid rgba(255,255,255,0.2);}

.Cross svg {
fill:var(--primary);}

.side-navbar {
position:absolute;
top:1px;
left:-280px;
width:260px;
z-index:2;
direction:ltr;
display:flex;
align-items:center;
justify-content:center;
border-radius:0 20px 20px 0;
backdrop-filter:blur(10px);
background:rgba(255,255,255,0.1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:2px 0 8px rgba(255,255,255,0.1);}

.side-navbar.active {
left:0;}

.item-list {
position:absolute;
top:160px;
width:220px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;
list-style:none;
pointer-events:none;}

.item {
position:relative;
width:100%;
height:40px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:auto;
cursor:pointer;}

.item.active {
pointer-events:none;}

.item .icon {
position:absolute;
left:0;
width:40px;
height:40px;
opacity:0.5;
display:flex;
align-items:center;
justify-content:center;}

.item .square {
position:absolute;
left:0;
opacity:0;
pointer-events:none;
filter:drop-shadow(0 5px 5px rgba(0,0,0,0.8));}

.item.active .icon, .item.active .square, .item.active .Text {
opacity:1;}

.icon svg {
fill:var(--primary);}

.item .Text, .account-settings .fields li section span {
position:absolute;
opacity:0.5;
font-size:0.6rem;
color:var(--primary);}

.item .Text {
left:50px;}

.account-settings .fields li section span {
top:0;
left:5px;}

.account {
position:absolute;
bottom:20px;
width:220px;
height:90px;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
outline:1px solid rgba(255,255,255,0.2);
box-shadow:0 4px 8px rgba(255,255,255,0.1);
background:linear-gradient(to bottom right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.05) 75%);}

.info-container {
position:absolute;
width:180px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;}

.container {
position:absolute;
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;}

.account .container {
left:0;}

.account .settings {
position:absolute;
top:5px;
right:5px;
width:30px;
height:30px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;}

.settings .circle {
position:absolute;
width:25px;
height:25px;
opacity:0;
border-radius:50%;
transform:scale(0.5);
background:rgba(255,255,255,0.1);}

.account .settings .circle.active {
animation:Circle 0.6s;}

@keyframes Circle {
0%{opacity:0;transform:scale(0.5);}
50%{opacity:1;transform:scale(1);}
100%{opacity:0;transform:scale(0.5);}}

.container .glass {
position:absolute;
width:100%;
height:100%;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(to bottom right, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0.3) 75%);}

.container img {
position:absolute;
width:95%;
height:95%;
border-radius:50%;
object-fit:cover;
pointer-events:none;}

.container .Active {
position:absolute;
bottom:2px;
right:2px;
width:10px;
height:10px;
border-radius:50%;
background:#4abf02;}

.account .account-info {
position:absolute;
left:50px;
width:140px;
height:80%;
overflow:hidden;}

.account .account-info h3, .account .account-info span {
position:absolute;
max-width:95%;
font-size:0.7rem;
font-weight:700;
white-space:nowrap;
overflow:hidden;
color:var(--primary);
text-overflow:ellipsis;}

.account .account-info h3 {
top:0;
font-size:0.7rem;
font-weight:700;}

.account .account-info span {
bottom:0;
font-size:0.5rem;
font-weight:300;}

.search {
position:absolute;
top:90px;
width:220px;
height:35px;
display:flex;
align-items:center;
justify-content:center;}

.search svg {
position:absolute;
left:2.5px;
pointer-events:none;
stroke-width:2;
stroke:rgba(255,255,255,0.5);}

.input::placeholder {
position:absolute;
top:50%;
font-weight:400;
font-size:0.6rem;
transform:translateY(-50%);
color:rgba(255,255,255,0.7);}

.input:focus::placeholder {
color:transparent;}

.input {
position:absolute;
width:100%;
height:100%;
font-weight:400;
font-size:0.6rem;
border:none;
border-radius:10px;
padding-left:35px;
caret-color:#fff;
pointer-events:auto;
background:var(--background);
color:rgba(255,255,255,0.5);
outline:1px solid rgba(255,255,255,0.2);}

.input:focus {
color:rgba(255,255,255,1);
outline:1px solid rgba(255,255,255,0.5);}

.account-settings .content {
position:absolute;
top:0;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .content-container {
position:relative;
width:100%;
height:670px;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;}

.account-settings .container {
position:absolute;
width:120px;
height:120px;
top:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .container {
top:50px;
width:120px;
height:120px;}

.account-settings .container img {
width:97%;
height:97%;}

.account-settings .camera {
position:absolute;
bottom:-12px;
right:-3px;
width:55px;
height:55px;
border-radius:50%;
cursor:pointer;
pointer-events:auto;
fill:#0B1A9B;
transition:0.3s;
background:var(--primary);
box-shadow:-3px 3px 5px rgba(0,0,0,0.1);}

.camera:active, .account-settings .save:active {
transform:scale(0.8);}

.account-settings .fields {
position:absolute;
top:250px;
list-style:none;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;}

.account-settings .fields li {
position:relative;
width:100%;
height:60px;
display:flex;
align-items:center;
justify-content:center;}

.account-settings .fields li section {
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;}

.account-settings .fields li:first-child section:nth-child(1), .account-settings .fields li:last-child section:nth-child(1) {
left:0;
width:calc(50% - 20px);}

.account-settings .fields li:first-child section:nth-child(2), .account-settings .fields li:last-child section:nth-child(2) {
right:0;
width:calc(50% - 20px);}

.account-settings .fields li section input {
position:absolute;
bottom:0;
width:100%;
height:40px;
padding:0 10px;}

.account-settings .fields span.active {
opacity:1;}

.account-settings .save {
position:absolute;
bottom:30px;
padding:12px 25px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
opacity:0;
border:none;
cursor:pointer;
font-size:0.8rem;
pointer-events:none;
color:rgba(255,255,255,1);
outline:1px solid rgba(255,255,255,0.2);
box-shadow:1px 4.5px 12px rgba(255,255,255,0.1);
background:linear-gradient(to bottom right, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.05) 75%);}

.save.active {
opacity:1;
pointer-events:auto;}

@media screen and (max-width:400px) {

.account-settings .fields {
width:90%;}

}

@media screen and (min-width:400px) {

.account-settings .fields {
width:360px;}

}

@media screen and (max-height:670px) {

.side-navbar {
height:668px;}

.account-settings .content {
height:670px;}

}

@media screen and (min-height:670px) {

.side-navbar {
height:calc(100% - 2px);}

.account-settings .content {
height:100%;}

}

</style>
